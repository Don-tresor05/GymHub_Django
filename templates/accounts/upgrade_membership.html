{% extends 'base.html' %}
{% block title %}Upgrade Membership{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm">
      <div class="card-header bg-white">
        <h5 class="mb-0"><i class="fas fa-arrow-up me-2"></i>Upgrade Membership</h5>
      </div>
      <div class="card-body">
        <p class="text-muted">Gym: <strong>{{ membership.gym.name }}</strong></p>
        <p class="text-muted">Current tier: <span class="badge bg-info">{{ membership.tier }}</span></p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Select Plan</label>
            <select name="plan_id" class="form-control">
              {% for p in plans %}
                <option value="{{ p.id }}">{{ p.name }} - {{ p.get_tier_display }} - {{ p.duration_days }} days - {{ p.price|floatformat:0 }} RWF</option>
              {% endfor %}
            </select>
          </div>
          <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Upgrade</button>
          <a href="{% url 'member_dashboard' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
